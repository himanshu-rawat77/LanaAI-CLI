name: Bug Report
description: Create a report to help us improve Lana AI CLI
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: input
    id: version
    attributes:
      label: Lana CLI Version
      description: What version of Lana CLI are you using? (Run `lana --version`)
      placeholder: "1.1.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System & Node Version
      description: e.g., macOS Sonoma, Ubuntu 24.04, Windows 11 (Node 20.12.0)
      placeholder: "Ubuntu 22.04, Node v20.15.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or exact command invocation to reproduce the behavior.
      placeholder: |
        1. Run 'lana orb tx <sig>'
        2. See error output...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Error Logs
      description: Paste any error messages or stack traces here.
      render: shell
